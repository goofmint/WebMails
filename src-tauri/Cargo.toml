[package]
name = "eluma"
version = "0.1.0"
description = "Eluma — a desktop app that hosts webmail services"
authors = ["Atsushi Nakatsugawa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.1", features = ["unstable", "protocol-asset"] }
tauri-plugin-notification = "2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "ico",
    "gif",
    "bmp",
    "webp",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1", features = ["time", "rt", "macros"] }
toml = "1.1.6"
toml_edit = "0.25"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"

# App Nap assertion (design.md §1.2, §2.2.11; SPEC.md §9.1). macOS only —
# Windows' dependency set is untouched.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

# `host-child-windows` selects the fallback `WebviewHost` implementation,
# `ChildWindowHost` (design.md §2.2.4, §8.1; Task 1.7), in place of the
# default `MultiwebviewHost`. No dependency crates are needed for it — it
# is built entirely on APIs `tauri`'s existing `unstable` feature already
# enables — so this feature carries no dependency list of its own.
[features]
host-child-windows = []

[lints]
workspace = true
