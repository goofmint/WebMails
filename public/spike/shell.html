<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Eluma spike — shell</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #16181d;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 6px 4px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
        margin: 2px 0 6px;
        text-align: center;
      }
      button.slot {
        appearance: none;
        border: 1px solid #333;
        background: #22252c;
        color: #eee;
        border-radius: 8px;
        padding: 8px 2px;
        font-size: 11px;
        line-height: 1.3;
        cursor: pointer;
      }
      button.slot[data-active="true"] {
        background: #3a5fd9;
        border-color: #6c8cff;
      }
      button.slot:hover {
        border-color: #6c8cff;
      }
      #mode {
        margin-top: auto;
        font-size: 9px;
        opacity: 0.5;
        text-align: center;
        word-break: break-all;
      }
      #log {
        font-size: 9px;
        opacity: 0.7;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Eluma spike</h1>
    <div id="buttons"></div>
    <div id="log"></div>
    <div id="mode"></div>
    <script>
      // This page is the ONLY webview granted the `switch_service` /
      // `spike-shell` capability. Every child service page is denied it.
      function invoke(cmd, args) {
        return window.__TAURI_INTERNALS__.invoke(cmd, args);
      }

      function logLine(text) {
        var el = document.getElementById("log");
        el.textContent = text + "\n" + el.textContent;
      }

      function render() {
        var spike = window.__ELUMA_SPIKE__;
        var modeEl = document.getElementById("mode");
        var buttonsEl = document.getElementById("buttons");
        buttonsEl.innerHTML = "";
        if (!spike) {
          modeEl.textContent = "window.__ELUMA_SPIKE__ not injected";
          return;
        }
        modeEl.textContent = "mode=" + spike.mode + " active=" + spike.activeIndex;
        spike.children.forEach(function (child, i) {
          var btn = document.createElement("button");
          btn.className = "slot";
          btn.dataset.active = String(i === spike.activeIndex);
          btn.textContent = child.label;
          btn.title = child.url;
          btn.addEventListener("click", function () {
            invoke("switch_service", { index: i })
              .then(function () {
                logLine("switch_service(" + i + ") ok");
                spike.activeIndex = i;
                render();
              })
              .catch(function (err) {
                logLine("switch_service(" + i + ") FAILED: " + err);
              });
          });
          buttonsEl.appendChild(btn);
        });
      }

      render();
    </script>
  </body>
</html>
